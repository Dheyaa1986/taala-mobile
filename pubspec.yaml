name: taal
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  alice: ^1.0.0-dev.12
  alice_dio: ^1.0.4
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  cloud_firestore: ^6.3.0
  country_code_picker: ^3.1.0
  custom_date_range_picker: ^1.1.0
  dartz: ^0.10.1
  datepicker_dropdown: ^1.0.2
  dio: ^5.4.0
  dotted_border: ^3.1.0

  # 🔥 FIXED (Flutter SDK requires intl 0.20.2)
  intl: any

  # 🔥 FIXED (compatible with intl 0.20.2)
  easy_localization: ^3.0.8

  equatable: ^2.0.5
  expandable_page_view: ^1.0.17
  extended_wrap: ^0.1.5
  ffr_hex_color: ^0.0.2
  file_picker: ^11.0.2
  map_launcher: ^4.5.0

  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  firebase_remote_config: ^6.4.0
  firebase_storage: ^13.3.0

  flutter_bloc: ^9.1.0
  flutter_colorpicker: ^1.0.3
  flutter_easyloading: ^3.0.5

  flutter_form_builder: ^10.3.0+2
  intl_phone_field: ^3.2.0

  flutter_local_notifications: any
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^10.1.0
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.17
  fluttertoast: ^9.0.0

  get_it: ^9.2.1
  go_router: ^17.2.3
  gradient_borders: ^1.0.1
  image_picker: ^1.0.7
  internet_connection_checker: ^3.0.1

  jwt_decoder: ^2.0.1
  location: any
  multiple_result: ^5.1.0
  ntp: ^2.0.0
  path: any
  path_provider: ^2.1.5
  path_provider_android: ^2.2.17
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  pinput: ^6.0.2
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  slide_countdown: ^2.0.2
  sliver_tools: ^0.2.12
  smooth_page_indicator: ^2.0.1
  svg_flutter: ^0.0.1
  syncfusion_flutter_pdfviewer: ^29.1.39
  timeago: ^3.7.0
  url_launcher: ^6.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/translations/
    - assets/fonts/
    - assets/taal.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-ExtraBold.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/Dawajena.png"
  adaptive_icon_background: "#FFFFFF"
dependency_overrides:
 
